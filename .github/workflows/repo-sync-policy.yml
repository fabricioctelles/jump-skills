name: Repository Sync Policy

# Ensures repository-level exclusions never block eligible Ninja sources.

on:
  push:
    branches: [main]
    paths:
      - "sync-repos.sh"
      - "repos.md"
      - "ninjas.md"
      - "tests/**"
      - ".github/workflows/repo-sync-policy.yml"
  pull_request:
    branches: [main]
    paths:
      - "sync-repos.sh"
      - "repos.md"
      - "ninjas.md"
      - "tests/**"
      - ".github/workflows/repo-sync-policy.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repository-sync-policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check repository-level sync policy
        run: ./tests/test-repo-sync-policy.sh
